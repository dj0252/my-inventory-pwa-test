<html lang="zh-Hant">
<meta charset="utf-8">

<link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#24533f">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ed;color:#233a31;font:16px/1.5 "Microsoft JhengHei",sans-serif}main{max-width:850px;margin:auto;padding:32px 18px}h1{font-size:clamp(32px,7vw,56px);margin:0}h2,h3,p{margin:0 0 8px}header{margin-bottom:24px}section,article{background:#fff;border:1px solid #dedfd3;border-radius:16px;padding:18px;margin:12px 0}label{display:block}input,button,select{font:inherit;padding:9px 12px;border:1px solid #84968a;border-radius:8px}input,select{width:100%;background:white;color:inherit}button{cursor:pointer;background:white;color:inherit}button[type=submit]{background:#24533f;color:white}button:hover{border-color:#153b2c}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b47626;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}article p{overflow-wrap:anywhere}article h3{overflow-wrap:anywhere;color:#8a6100}.place{font-weight:bold;color:#24533f}footer{margin-top:20px}#status{min-height:1.5em;margin-top:8px}
.photo{width:112px;height:112px;object-fit:contain;background:#f6f4ed;border-radius:10px;margin:8px 0}.photo-tools{margin-top:12px}#suggestions{margin-bottom:12px}
.gallery{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.gallery figure{margin:0}.gallery .photo{width:148px;height:var(--result-photo-height);display:block}.gallery figcaption{font-size:.9rem}.location-card{text-align:left}.location-card img{display:block;width:96px;height:72px;object-fit:contain;margin-bottom:4px}.location-card[aria-pressed="true"]{background:#24533f;color:white}#save-item:active{transform:translateY(2px);background:#173c2b}
#save-item:disabled{background:#dcebe0;color:#24533f;cursor:default}
#status:not(:empty){font-weight:bold}
summary{cursor:pointer;font-weight:bold}#form-title{font-size:1.4rem}#pages:not(:empty){margin-top:16px}[role="tab"][aria-selected="true"]{background:#24533f;color:white}[role="tabpanel"][hidden]{display:none}.backup-settings{margin-top:10px}.photo-zoom{padding:0;border:0;border-radius:10px;cursor:zoom-in}
.photo-zoom .photo{margin:0}
#photo-dialog{width:min(92vw,900px);max-height:92vh;border:1px solid #84968a;border-radius:16px;color:inherit;padding:16px}
#photo-dialog::backdrop{background:rgba(0,0,0,.68)}
.photo-dialog-bar{margin-bottom:12px}
.photo-dialog-bar h2{flex:1 1 180px;margin:0;overflow-wrap:anywhere}
#photo-large{display:block;width:100%;max-height:74vh;object-fit:contain}
.gallery{align-items:flex-start}.item-note{flex:1 1 220px;min-width:0;background:#f6f4ed;border-radius:8px;padding:10px 12px}.item-note p{white-space:pre-wrap;margin:4px 0 0}.gallery{--result-photo-height:116px}.gallery:has(.photo-zoom) .item-note{height:var(--result-photo-height);overflow-y:auto}.item-photo-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px 28px;align-items:start;max-width:560px}.item-photo-fields>.photo-tools{min-width:0;max-width:280px}.photo-action{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:42px;padding:8px 12px;border:1px solid transparent;border-radius:10px;font-weight:600;line-height:1.3;transition:background-color .18s,border-color .18s,box-shadow .18s,transform .18s}
.photo-action[hidden]{display:none}
.photo-action svg{width:1.1em;height:1.1em;flex:none}
.photo-pick{background:#24533f;color:#fff;border-color:#24533f;--button-ring-width:2px}
.photo-scan{background:#fff3d3;border-color:#e6ce89;color:#694900}
.photo-remove{background:#fff7f5;border-color:#ead5d0;color:#873e32}
@media(hover:hover){
  .photo-action:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 10px #233a3122}
  .photo-pick:not(:disabled):hover{background:#193f30}
  .photo-scan:not(:disabled):hover{background:#ffebba;border-color:#be9a43}
  .photo-remove:not(:disabled):hover{background:#fbe8e3;border-color:#bf8b81}
}
.photo-action:not(:disabled):active{transform:translateY(1px);box-shadow:inset 0 2px 4px #233a3122}
.photo-action:disabled{opacity:.65;cursor:wait}
.photo-scan[aria-busy="true"] svg{display:none}
.photo-scan[aria-busy="true"]::before{content:"";width:.85em;height:.85em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:photo-spin .75s linear infinite}
@keyframes photo-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){
  .photo-action{transition:none}
  .photo-action:not(:disabled):is(:hover,:active){transform:none}
  .photo-scan[aria-busy="true"]::before{animation:none}
}
button, #photo-download{
  --button-shadow:0 2px 5px #233a3118;
  box-shadow:inset 0 0 0 var(--button-ring-width,2px) #fff,var(--button-shadow);
  transition:background-color .18s,border-color .18s,box-shadow .18s,transform .18s;
}
button:not(.photo-action):not(.photo-zoom):not([aria-selected="true"]):not([aria-pressed="true"]):not([type="submit"]), #photo-download{
  background:#f6f4ed;
}
#photo-download{display:inline-flex;align-items:center;padding:9px 12px;border:1px solid #84968a;border-radius:8px;color:inherit}
@media(hover:hover){
  button:not(:disabled):hover, #photo-download:hover{
    transform:translateY(-1px);
    box-shadow:inset 0 0 0 var(--button-ring-width,2px) #fff,0 4px 10px #233a3129;
  }
}
button:not(:disabled):active, #photo-download:active{
  transform:translateY(1px);
  box-shadow:inset 0 0 0 var(--button-ring-width,2px) #fff,0 1px 3px #233a3122;
}
button:disabled{box-shadow:inset 0 0 0 var(--button-ring-width,2px) #fff}
@media(prefers-reduced-motion:reduce){
  button, #photo-download{transition:none}
  button:not(:disabled):is(:hover,:active), #photo-download:is(:hover,:active), #save-item:active{transform:none}
}
@media(pointer:coarse){.photo-action{min-height:44px}}
/* Keep the version and update control beside the title, not under the subtitle. */
.app-header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.app-header-top h1{flex:0 0 auto}
.app-version-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-left:auto}
.app-version-actions #app-version{white-space:nowrap;font-size:.92rem}
.app-version-actions #check-update{white-space:nowrap;padding:7px 10px}
@media(max-width:430px){.app-header-top{align-items:flex-start}.app-version-actions{gap:6px}.app-version-actions #app-version{font-size:.82rem}.app-version-actions #check-update{padding:6px 8px;font-size:.9rem}}
#app-install-row:has(#install-app[hidden]){display:none}

<main>
<header><div class="app-header-top"><h1>大海撈針</h1><div class="app-version-actions"><span id="app-version"></span><button id="check-update" type="button" hidden>檢查更新</button></div></div><p>記下你有哪些東西，以及去哪裡找。</p><p id="app-install-row"><button id="install-app" type="button" hidden>安裝到手機</button></p><p id="pwa-status" role="status" hidden></p><div id="app-update" role="status" hidden><p>大海撈針有新版本可以更新。</p><button id="apply-update" type="button">更新程式</button></div></header>
<nav class="actions" role="tablist" aria-label="清冊功能">
<button type="button" id="add-tab" role="tab" aria-controls="editor" aria-selected="false" tabindex="-1">新增物品</button>
<button type="button" id="find-tab" role="tab" aria-controls="finder" aria-selected="true">尋找物品</button>
</nav>
<section id="editor" role="tabpanel" aria-labelledby="add-tab" hidden>
<h2 id="form-title">新增物品</h2>
<form id="entry">
<div class="item-photo-fields">
<div class="photo-tools">
<label for="photo-file">物品照片（必填）</label>
<div class="actions"><button type="button" id="photo-choose" class="photo-action photo-pick"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h4l1.5-2h5L16 8h4v11H4z"/><circle cx="12" cy="13" r="3"/></svg><span>選擇照片</span></button><button type="button" id="photo-camera" class="photo-action photo-pick" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h4l1.5-2h5L16 8h4v11H4z"/><circle cx="12" cy="13" r="3"/></svg><span>拍照</span></button></div><input id="photo-file" type="file" accept="image/*" hidden>
<img id="photo-preview" class="photo" alt="物品照片預覽" hidden>
<div class="actions"><button type="button" id="recognize" class="photo-action photo-scan" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5M8 12h8"/></svg><span>辨識照片</span></button><button type="button" id="remove-photo" class="photo-action photo-remove" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg><span>移除照片</span></button></div>
<p id="photo-selection" role="status">尚未選取照片</p><p id="photo-status" role="status"></p>
<div id="suggestions" class="actions"></div>
</div>
<div class="photo-tools">
<label for="extra-file">第二張物品照片（選填）</label>
<div class="actions"><button type="button" id="extra-choose" class="photo-action photo-pick" aria-label="選擇第二張物品照片"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h4l1.5-2h5L16 8h4v11H4z"/><circle cx="12" cy="13" r="3"/></svg><span>選擇照片</span></button><button type="button" id="extra-camera" class="photo-action photo-pick" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h4l1.5-2h5L16 8h4v11H4z"/><circle cx="12" cy="13" r="3"/></svg><span>拍照</span></button></div>
<input id="extra-file" type="file" accept="image/*" hidden>
<img id="extra-preview" class="photo" alt="第二張物品照片預覽" hidden>
<div class="actions"><button type="button" id="extra-remove" class="photo-action photo-remove" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg><span>移除第二張照片</span></button></div>
<p id="extra-status" role="status"></p>
</div>
</div>
<div class="grid">
<label>物品名稱<input name="name" required maxlength="120" placeholder="例：備用充電線"></label>
<label>備註（選填）<input name="note" maxlength="300" placeholder="例：放在黑色收納袋裡"></label>
<label>收納位置<input name="place" required maxlength="180" list="places" placeholder="例：書房 ＞ 書桌 ＞ 右側第二格"></label>
</div>
<div class="photo-tools">
<label for="place-file">收納位置照片（選填，同名位置共用）</label>
<div class="actions"><button type="button" id="place-choose" class="photo-action photo-pick"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h4l1.5-2h5L16 8h4v11H4z"/><circle cx="12" cy="13" r="3"/></svg><span>選擇照片</span></button><button type="button" id="place-camera" class="photo-action photo-pick" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h4l1.5-2h5L16 8h4v11H4z"/><circle cx="12" cy="13" r="3"/></svg><span>拍照</span></button><span id="place-selection" role="status">尚未選取照片</span></div><input id="place-file" type="file" accept="image/*" hidden>
<img id="place-preview" class="photo" alt="收納位置照片預覽" hidden>
<div><button type="button" id="remove-place-photo" class="photo-action photo-remove" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg><span>移除位置照片</span></button></div>
<p id="place-status" role="status"></p>
</div>
<div class="actions"><button type="submit" id="save-item" hidden>儲存物品</button><button type="button" id="cancel" hidden>取消編輯</button></div>
</form>
<datalist id="places"></datalist>
<p id="status" role="status"></p>
</section>
<section id="finder" role="tabpanel" aria-labelledby="find-tab">
<h2 id="list-title">尋找物品</h2>
<div class="grid"><label>搜尋物品名稱<input id="query" type="search" autocomplete="off" placeholder="例：充電線、膠水"></label>
<label>依位置瀏覽<select id="location"></select></label></div>
<details id="location-gallery"><summary>看位置照片</summary><div id="location-cards" class="actions" aria-label="收納位置"></div></details><p id="count" tabindex="-1" aria-live="polite"></p><div id="items"></div><div id="pages" class="actions"></div>
</section>
<footer><p>清冊和縮圖儲存在這個瀏覽器。辨識需要連網載入模型，照片在瀏覽器內處理。換裝置或清除瀏覽資料前，可先匯出備份。</p>
<div class="actions"><button id="export">匯出備份</button><button id="import">匯入備份</button><input id="file" type="file" accept=".json,application/json" hidden></div>
<div class="actions backup-settings"><button id="backup-folder" hidden>設定備份資料夾</button><span id="backup-folder-hint" hidden>第一次使用備份功能前，請先設定備份資料夾。</span></div>
<p id="backup-status" role="status"></p></footer>
<dialog id="photo-dialog" aria-labelledby="photo-dialog-title">
  <div class="actions photo-dialog-bar">
    <h2 id="photo-dialog-title"></h2>
    <a id="photo-download">下載照片</a>
    <form method="dialog"><button autofocus>關閉</button></form>
  </div>
  <img id="photo-large" alt="">
</dialog>
</main>
<script>
'use strict';
const key = 'personal-inventory-v1';
const byId = id => document.getElementById(id);
const photoDialog = byId('photo-dialog');
const largePhoto = byId('photo-large');
photoDialog.addEventListener('close', () => {
  largePhoto.removeAttribute('src');
  byId('photo-download').removeAttribute('href');
});

function openPhoto(source, title, label) {
  byId('photo-dialog-title').textContent = title;
  largePhoto.alt = title;
  largePhoto.src = source;
  const download = byId('photo-download');
  download.href = source;
  download.download = label + '.jpg';
  photoDialog.showModal();
}

const form = byId('entry');
const tabs = [byId('add-tab'), byId('find-tab')];

function selectTab(selected, focus = false) {
  for (const tab of tabs) {
    const active = tab === selected;
    tab.setAttribute('aria-selected', String(active));
    tab.tabIndex = active ? 0 : -1;
    byId(tab.getAttribute('aria-controls')).hidden = !active;
  }
  if (focus) selected.focus();
}

for (const tab of tabs) {
  tab.onclick = () => selectTab(tab);
  tab.onkeydown = event => {
    let target;
    if (event.key === 'Home') target = tabs[0];
    if (event.key === 'End') target = tabs[1];
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      target = tabs.find(other => other !== tab);
    }
    if (target) {
      event.preventDefault();
      selectTab(target, true);
    }
  };
}
const saveButton = byId('save-item');
const fields = form.elements;
const status = byId('status');
const backupStatus = byId('backup-status');
const locationFilter = byId('location');
let entries = [];
let editing = null;
let readable = false;
let photo = '';
let photoRevision = 0;
let activePlace = '';
let placePhoto = '';
let placeRevision = 0;
const placeFile = byId('place-file');
byId('place-choose').onclick = () => placeFile.click();
const placePreview = byId('place-preview');
const placeStatus = byId('place-status');
const removePlacePhoto = byId('remove-place-photo');

function photoForPlace(place) {
  return entries.find(item => item.place === place && item.placePhoto)?.placePhoto ?? '';
}

function syncPlacePhoto() {
  const place = fields.place.value.trim();
  if (place === activePlace) return;
  activePlace = place;
  showPlacePhoto(photoForPlace(place));
  if (placePhoto) placeStatus.textContent = '已帶入這個位置的照片。';
}

function updateSaveVisibility() {
  const hasText = [fields.name, fields.place, fields.note].some(field => field.value.trim());
  saveButton.hidden = !(saveButton.disabled || hasText || photo || extraPhoto || placePhoto);
}

form.addEventListener('input', updateSaveVisibility);

function showPlacePhoto(value, selection = '已有收納位置照片') {
  placeRevision++;
  placePhoto = value;
  updateSaveVisibility();
  placeFile.value = '';
  byId('place-selection').textContent = value ? selection : '尚未選取照片';
  placePreview.hidden = !value;
  if (value) placePreview.src = value;
  else placePreview.removeAttribute('src');
  removePlacePhoto.hidden = !value;
  placeStatus.textContent = '';
}
let modelPromise;
const photoFile = byId('photo-file');
byId('photo-choose').onclick = () => photoFile.click();
const preview = byId('photo-preview');
const photoStatus = byId('photo-status');
const suggestions = byId('suggestions');
const recognize = byId('recognize');

function showPhoto(value, selection = '已有物品照片') {
  photoRevision++;
  photo = value;
  updateSaveVisibility();
  photoFile.value = '';
  byId('photo-selection').textContent = value ? selection : '尚未選取照片';
  preview.hidden = !value;
  if (value) preview.src = value;
  else preview.removeAttribute('src');
  recognize.hidden = !value;
  recognize.disabled = false;
  recognize.removeAttribute('aria-busy');
  byId('remove-photo').hidden = !value;
  suggestions.replaceChildren();
  photoStatus.textContent = '';
}

function loadScript(url) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = url;
    script.onload = resolve;
    script.onerror = () => { script.remove(); reject(new Error('Model dependency unavailable')); };
    document.head.append(script);
  });
}

function getModel() {
  if (!modelPromise) {
    modelPromise = (async () => {
      if (!window.tf) await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
      if (!window.mobilenet) await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
      return window.mobilenet.load({version: 2, alpha: 1});
    })().catch(error => { modelPromise = undefined; throw error; });
  }
  return modelPromise;
}

const translations = {
  'hand-held computer':'手持式電腦', 'handheld computer':'手持式電腦',
  'switch':'開關', 'electric switch':'開關', 'hard disc':'硬碟',
  'hard disk':'硬碟', 'fixed disk':'硬碟', 'flash drive':'隨身碟',
  'desktop computer':'桌上型電腦', 'modem':'數據機', 'joystick':'遊戲控制器', 'ocarina':'陶笛', 'hatchet':'手斧',
  'power drill':'電鑽', 'measuring cup':'量杯', 'bottlecap':'瓶蓋',
  'can opener':'開罐器', 'frying pan':'平底鍋', 'ladle':'湯勺',
  'stapler':'訂書機', 'envelope':'信封', 'binder':'活頁夾',
  'wallet':'錢包', 'sunglasses':'太陽眼鏡', 'suitcase':'行李箱',
  'padlock':'掛鎖', 'combination lock':'密碼鎖', 'key':'鑰匙',
  'computer keyboard':'電腦鍵盤', 'mouse':'滑鼠', 'remote control':'遙控器',
  'cellular telephone':'手機', 'laptop':'筆記型電腦', 'notebook':'筆記型電腦',
  'water bottle':'水瓶', 'coffee mug':'馬克杯', 'cup':'杯子',
  'backpack':'背包', 'umbrella':'雨傘', 'running shoe':'跑鞋',
  'screwdriver':'螺絲起子', 'hammer':'鐵鎚', 'scissors':'剪刀',
  'tape player':'卡帶播放器', 'digital clock':'數位時鐘', 'wall clock':'掛鐘',
  'vacuum':'吸塵器', 'electric fan':'電風扇', 'toaster':'烤麵包機',
  'microphone':'麥克風', 'monitor':'螢幕', 'printer':'印表機',
  'ballpoint':'原子筆', 'pencil box':'鉛筆盒', 'eraser':'橡皮擦'
};

recognize.onclick = async () => {
  const revision = photoRevision;
  recognize.disabled = true;
  suggestions.replaceChildren();
  recognize.setAttribute('aria-busy', 'true');
  photoStatus.textContent = '正在載入模型並辨識照片…';
  try {
    const model = await getModel();
    if (revision !== photoRevision) return;
    await preview.decode();
    if (revision !== photoRevision) return;
    const predictions = await model.classify(preview, 3);
    if (revision !== photoRevision) return;
    const names = new Set();
    for (const prediction of predictions) {
      const labels = prediction.className.toLowerCase().split(',').map(label => label.trim());
      const label = labels.find(label => Object.hasOwn(translations, label));
      if (!label) continue;
      const name = translations[label];
      if (names.has(name)) continue;
      names.add(name);
      const button = element('button', name, suggestions);
      button.type = 'button';
      button.onclick = () => { fields.name.value = name; updateSaveVisibility(); fields.name.focus(); };
    }

};

async function readThumbnail(file) {
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const scale = Math.min(1, 480 / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    const context = canvas.getContext('2d');
    context.fillStyle = '#fff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.68);
  } finally {
    URL.revokeObjectURL(url);
  }
}

function validPhoto(value) {
  return value === undefined || (typeof value === 'string' &&
    /^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/.test(value));
}

function valid(data) {
  return Array.isArray(data) && data.every(item =>
    item && Number.isSafeInteger(item.id) && typeof item.name === 'string' &&
    item.name.trim() && typeof item.place === 'string' && item.place.trim() &&
    typeof item.note === 'string' &&
    validPhoto(item.photo) && validPhoto(item.extraPhoto) && validPhoto(item.placePhoto) &&
    (item.usedUp === undefined || typeof item.usedUp === 'boolean')
  ) && new Set(data.map(item => item.id)).size === data.length;
}

let database;
let backupFolder;
let revision = 0;
let writing = false;

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('personal-inventory', 1);
    request.onupgradeneeded = () => {
      request.result.createObjectStore('items', {keyPath: 'id'});
      request.result.createObjectStore('metadata');
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('資料庫被其他分頁占用'));
  });
}

function transaction(work) {
  return new Promise((resolve, reject) => {
    const tx = database.transaction(['items', 'metadata'], 'readwrite');
    tx.oncomplete = resolve;
    tx.onabort = () => reject(tx.error);
    const items = tx.objectStore('items');
    const metadata = tx.objectStore('metadata');
    const state = metadata.get('revision');
    state.onsuccess = () => {
      try {
        work(items, metadata, state.result);
      } catch (error) {
        tx.abort();
        reject(error);
      }
    };
  });
}

async function initializeStorage() {
  try {
    database = await openDatabase();
    database.onversionchange = () => database.close();
    await transaction((items, metadata, storedRevision) => {
      if (storedRevision === undefined) {
        const legacy = JSON.parse(localStorage.getItem(key) ?? '[]');
        if (!valid(legacy)) throw new Error('舊清冊格式有誤');
        for (const item of legacy) items.put(item);
        metadata.put(0, 'revision');
      }
      const folder = metadata.get('backup-folder');
      folder.onsuccess = () => { backupFolder = folder.result; };
      revision = storedRevision ?? 0;
      const request = items.getAll();
      request.onsuccess = () => {
        entries = request.result.sort((a, b) => b.id - a.id);
      };
    });
    readable = true;
  } catch {
    entries = [];
    backupStatus.textContent = database
      ? '無法讀取清冊。若有備份，可使用下方的匯入功能。'
      : '無法開啟瀏覽器的清冊資料庫。請用原本的瀏覽器開啟清冊後重試。';
  }
  render();
}

async function save(next, message, feedback = status, restore = false) {
  if (writing) {
    feedback.textContent = '清冊正在儲存，請稍候。';
    return false;
  }
  if (!database || (!readable && !restore)) {
    feedback.textContent = '目前無法儲存清冊。請確認瀏覽器可使用本機資料庫。';
    return false;
  }
  writing = true;
  let changedElsewhere = false;
  try {
    await transaction((items, metadata, storedRevision) => {
      if ((storedRevision ?? 0) !== revision) {
        changedElsewhere = true;
        throw new Error('清冊已在其他分頁更新');
      }
      if (restore) {
        items.clear();
        for (const item of next) items.put(item);
      } else {
        const before = new Map(entries.map(item => [item.id, item]));
        for (const item of next) {
          if (before.get(item.id) !== item) items.put(item);
          before.delete(item.id);
        }
        for (const id of before.keys()) items.delete(id);
      }
      metadata.put(revision + 1, 'revision');
    });
    revision++;
  } catch (error) {
    feedback.textContent = changedElsewhere
      ? '清冊已在其他分頁更新。請重新整理後再操作。'
      : error?.name === 'QuotaExceededError'
        ? '瀏覽器的清冊儲存空間不足。請釋出空間後重試。'
        : '清冊儲存失敗。請確認瀏覽器允許本機儲存，再試一次。';
    return false;
  } finally {
    writing = false;
  }
  readable = true;
  entries = next;
  feedback.textContent = message;
  render();
  return true;
}

const pageSize = 24;
let page = 0;

function render() {
  const selected = locationFilter.value;
  const places = [...new Set(entries.map(item => item.place))].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  locationFilter.replaceChildren(new Option('所有位置', ''));
  byId('places').replaceChildren();
  for (const place of places) {
    locationFilter.add(new Option(place, place));
    byId('places').append(new Option('', place));
  }
  locationFilter.value = places.includes(selected) ? selected : '';
  const cards = byId('location-cards');
  cards.replaceChildren();
  const totals = new Map();
  for (const item of entries) totals.set(item.place, (totals.get(item.place) ?? 0) + 1);
  for (const place of locationGallery.open ? places : []) {
    const button = element('button', '', cards);
    button.className = 'location-card';
    button.setAttribute('aria-pressed', String(locationFilter.value === place));
    const photo = photoForPlace(place);
    if (photo) {
      const image = element('img', '', button);
      image.src = photo;
      image.alt = '';
      image.loading = 'lazy';
    }
    element('span', place + '（' + (totals.get(place) ?? 0) + ' 件）', button);
    button.onclick = () => {
      locationFilter.value = locationFilter.value === place ? '' : place;
      byId('query').value = '';
      render();
      cards.children[places.indexOf(place)].focus();
    };
  }
  const query = byId('query').value.trim().toLocaleLowerCase();
  const filter = JSON.stringify([query, locationFilter.value]);
  if (filter !== previousFilter) page = 0;
  previousFilter = filter;
  const list = byId('items');
  const pages = byId('pages');
  list.replaceChildren();
  pages.replaceChildren();
  if (!query && !locationFilter.value) {
    byId('count').textContent = '目前有 ' + entries.length + ' 筆物品。輸入關鍵字或選擇位置即可查看。';
    return;
  }
  const terms = query.split(/\s+/);
  const matches = entries.filter(item => {
    const text = item.name.toLocaleLowerCase();
    return (!locationFilter.value || item.place === locationFilter.value) &&
      terms.every(term => text.includes(term));
  });
  byId('count').textContent = entries.length
    ? (locationFilter.value ? locationFilter.value + ' · ' : '') + '顯示 ' + matches.length + ' 件，共 ' + (locationFilter.value ? (totals.get(locationFilter.value) ?? 0) : entries.length) + ' 件'
    : '清冊目前是空的。可以先記下幾件常找不到的東西。';
  const pageCount = Math.max(1, Math.ceil(matches.length / pageSize));
  page = Math.min(page, pageCount - 1);
  if (pageCount > 1) {
    for (const [label, step] of [['上一頁', -1], ['下一頁', 1]]) {
      const button = element('button', label, pages);
      button.disabled = page + step < 0 || page + step >= pageCount;
      button.onclick = () => {
        page += step;
        render();
        byId('count').focus();
      };
    }
    element('span', '第 ' + (page + 1) + ' 頁，共 ' + pageCount + ' 頁', pages);
  }
  if (!matches.length && entries.length) element('p', '找不到符合條件的物品。', list);
  for (const item of matches.slice(page * pageSize, (page + 1) * pageSize)) {
    const card = element('article', '', list);
    element('h3', item.name, card);
    element('p', item.place, card).className = 'place';
    const photos = [[item.photo, '物品照片'], [item.extraPhoto, '第二張物品照片'], [photoForPlace(item.place), '收納位置照片']];
    if (item.note || photos.some(([source]) => source)) {
      const gallery = element('div', '', card);
      gallery.className = 'gallery';
      for (const [source, label] of photos) {
        if (!source) continue;
        const figure = element('figure', '', gallery);
        const title = item.name + '的' + label;
        const button = element('button', '', figure);
        button.type = 'button';
        button.className = 'photo-zoom';
        button.setAttribute('aria-label', '放大查看' + title);
        button.onclick = () => openPhoto(source, title, label);
        const thumbnail = element('img', '', button);
        thumbnail.className = 'photo';
        thumbnail.alt = item.name + '的' + label;
        thumbnail.loading = 'lazy';
        thumbnail.src = source;
        element('figcaption', label, figure);
      }
      if (item.note) {
        const note = element('div', '', gallery);
        note.className = 'item-note';
        note.tabIndex = 0;
        note.setAttribute('role', 'region');
        note.setAttribute('aria-label', '備註');
        element('strong', '備註', note);
        element('p', item.note, note);
      }
    }
    const actions = element('div', '', card);
    actions.className = 'actions';
    element('button', '編輯／移動', actions).onclick = () => {
      selectTab(tabs[0]);
      editing = item.id;
      fields.name.value = item.name;
      fields.place.value = item.place;
      fields.note.value = item.note;
      showPhoto(item.photo ?? '');
      showExtraPhoto(item.extraPhoto ?? '');
      activePlace = item.place;
      showPlacePhoto(photoForPlace(item.place));
      byId('form-title').textContent = '編輯物品';
      byId('cancel').hidden = false;
      status.textContent = '';
      fields.name.focus();
    };
    element('button', '刪除', actions).onclick = async () => {
      if (confirm('要刪除「' + item.name + '」嗎？') &&
          await save(entries.filter(entry => entry.id !== item.id), '已刪除「' + item.name + '」。')) {
        if (editing === item.id) resetForm();
      }
    };
  }
}

form.onsubmit = async event => {
  event.preventDefault();
  if (saveButton.disabled) return;
  if (extraLoading || photoStatus.textContent === '正在讀取照片…' || placeStatus.textContent === '正在讀取位置照片…') {
    status.textContent = '照片讀取完成後即可儲存。';
    return;
  }
  if (!photo) {
    byId('photo-selection').textContent = '請先選取一張物品照片';
    byId('photo-choose').focus();
    return;
  }
  const name = fields.name.value.trim();
  const place = fields.place.value.trim();
  if (!name || !place) {
    status.textContent = '請填寫物品名稱和收納位置。';
    return;
  }
  let id = editing ?? Date.now();
  while (editing === null && entries.some(item => item.id === id)) id++;
  const item = {id, name, place, note: fields.note.value.trim()};
  if (photo) item.photo = photo;
  if (extraPhoto) item.extraPhoto = extraPhoto;
  if (placePhoto) item.placePhoto = placePhoto;
  const next = editing === null ? [item, ...entries] : entries.map(entry => entry.id === id ? item : entry);
  const linked = next.map(entry => {
    if (entry.place !== place || (entry.placePhoto ?? '') === placePhoto) return entry;
    const updated = {...entry};
    if (placePhoto) updated.placePhoto = placePhoto;
    else delete updated.placePhoto;
    return updated;
  });
  saveButton.disabled = true;
  if (await save(linked, '已儲存「' + name + '」。')) {
    resetForm();
    byId('query').value = '';
    locationFilter.value = '';
    render();
    saveButton.textContent = '儲存成功';
    setTimeout(() => {
      saveButton.textContent = '儲存物品';
      saveButton.disabled = false;
      updateSaveVisibility();

    }, 800);
    return;
  }
  saveButton.disabled = false;
};

function connectCamera(button, picker, allowed = () => true) {
  const camera = document.createElement('input');
  camera.type = 'file';
  camera.accept = 'image/*';
  camera.hidden = true;
  camera.setAttribute('capture', 'environment');
  // Keep the camera action visible: capture is a hint, not a reliable feature-detection property.
  picker.after(camera);
  button.hidden = false;
  camera.onchange = picker.onchange;
  button.onclick = () => {
    if (!allowed()) return;
    camera.value = '';
    camera.click();
  };
}

  async function checkForUpdate(manual = false) {
    if (!registration || checkUpdate.disabled) {
      if (manual) showPwaStatus('更新功能尚未準備好，請稍候再試。');
      return;
    }
    checkUpdate.disabled = true;
    try {
      await registration.update();
      const worker = registration.installing;
      if (worker && worker.state !== 'installed' && worker.state !== 'redundant' &&
          worker.state !== 'activated') {
        await new Promise(resolve => {
          const onStateChange = () => {
            if (!['installed', 'redundant', 'activated'].includes(worker.state)) return;
            worker.removeEventListener('statechange', onStateChange);
            resolve();
          };
          worker.addEventListener('statechange', onStateChange);
          onStateChange();
        });
      }
      if (manual) {
        showPwaStatus(worker?.state === 'redundant' ? '新版本下載失敗，請稍後再試。'
          : registration.waiting ? '找到新版本，請按「更新程式」。' : '已完成檢查，目前沒有可套用的更新。');
      }
    } catch {
      if (manual) showPwaStatus('無法檢查更新，請確認網路後再試。');
    } finally {
      checkUpdate.disabled = false;
      syncNotice();
    }
  }

  workers.register('./sw.js', {updateViaCache: 'none'}).then(reg => {
    registration = reg;
    checkUpdate.hidden = false;
    const watchInstall = () => reg.installing?.addEventListener('statechange', syncNotice);
    reg.addEventListener('updatefound', watchInstall);
    watchInstall();
    syncNotice();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkForUpdate();
    });
    window.addEventListener('online', () => checkForUpdate());
    checkForUpdate();
  }).catch(() => showPwaStatus('離線功能啟動失敗，請連線後重新開啟此頁。'));

  checkUpdate.addEventListener('click', () => checkForUpdate(true));
  applyUpdate.addEventListener('click', () => {
    if (!registration?.waiting || approved) return;
    if (writing) {
      showPwaStatus('正在儲存物品，請稍候再更新。');
      return;
    }
    if (!confirm('更新會重新開啟程式。請先儲存編輯中的物品。確定更新？')) return;
    const worker = registration.waiting;
    if (!worker) return;
    approved = true;
    syncNotice();
    worker.postMessage({type: 'SKIP_WAITING'});
  });
}
initializeStorage();
</script>
